<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Heonjoon (HJ) Lee</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(60% 50% at 50% 40%, rgba(29, 58, 138, .06), transparent 70%), #ffffff;
      color: #0c1b3d; text-align: center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    main { max-width: 560px; }
    svg { width: 160px; height: 160px; margin: 0 auto 8px; display: block; overflow: visible; }
    .s1, .s2 { fill: none; stroke-width: 4; stroke-linecap: round; }
    .s1 { stroke: #1d3a8a; animation: drift 4s ease-in-out infinite; }
    .s2 { stroke: #3c6ad6; animation: drift 4s ease-in-out infinite reverse; }
    .rung { stroke-width: 3; stroke-linecap: round; }
    @keyframes drift { 50% { transform: translateX(6px); } }
    h1 { margin: 0; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-weight: 400; font-size: clamp(3.2rem, 12vw, 6rem); line-height: 1; letter-spacing: -.02em; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; letter-spacing: .14em; color: #1d3a8a; margin: 0 0 14px; }
    p { color: #475570; font-size: 17px; line-height: 1.6; margin: 18px 0 30px; }
    a {
      display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 22px; border-radius: 999px;
      background: #1d3a8a; color: #ffffff; font-weight: 700; text-decoration: none;
      box-shadow: 0 10px 30px -12px rgba(29, 58, 138, .6);
    }
    a:focus-visible { outline: 2px solid #1d3a8a; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .s1, .s2 { animation: none; } }
  </style>
</head>
<body>
  <main>
    <!-- an unzipped double helix: the strands came apart -->
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <path class="s1" d="M38 8C38 30 58 30 58 52S30 74 30 96s14 16 14 16"/>
      <path class="s2" d="M82 8C82 30 62 30 62 52s28 22 28 44-14 16-14 16"/>
      <path class="rung" d="M42 14h36" stroke="#9a6a00"/>
      <path class="rung" d="M52 40h16" stroke="#8fb0ee"/>
      <path class="rung" d="M34 84h6M80 84h6" stroke="#8fb0ee" opacity=".8"/>
    </svg>
    <p class="code">ERROR 404 · 5′–NNNNNN–3′</p>
    <h1>This sequence doesn’t fold.</h1>
    <p>The page you’re looking for isn’t here, but the rest of the site is.</p>
    <a href="/" id="home">← Back to the homepage</a>
  </main>
  <script>
    /* Works for both a user site (/) and a project site (/Website/) on GitHub Pages. */
    (function () {
      var m = location.pathname.match(/^\/website(\/|$)/i);
      document.getElementById('home').setAttribute('href', m ? location.pathname.slice(0, 8) + '/' : '/');
    })();
  </script>
</body>
</html>
